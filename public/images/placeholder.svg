<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgGrad)" rx="16" />
  <g transform="translate(100, 60)">
    <!-- Laptop screen -->
    <rect x="20" y="20" width="160" height="105" rx="8" fill="#1e293b" />
    <rect x="26" y="26" width="148" height="93" rx="4" fill="url(#screenGrad)" opacity="0.9" />
    <!-- Screen graphic -->
    <circle cx="100" cy="72" r="20" fill="white" opacity="0.25" />
    <path d="M92 72 L100 64 L108 72 L100 80 Z" fill="white" opacity="0.8" />
    <!-- Laptop base -->
    <path d="M5 130 L195 130 L180 142 L20 142 Z" fill="#64748b" />
    <rect x="80" y="130" width="40" height="4" rx="2" fill="#94a3b8" />
  </g>
  <text x="200" y="235" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#64748b">SmartTech Device</text>
</svg>
